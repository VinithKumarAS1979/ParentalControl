<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website blocked</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111827;
      --accent: #f87171;
      --text: #e5e7eb;
      --muted: #94a3b8;
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(248, 113, 113, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(96, 165, 250, 0.12), transparent 25%),
        var(--bg);
      color: var(--text);
    }

    .wrap {
      max-width: 760px;
      margin: 10vh auto;
      padding: 32px;
      background: linear-gradient(180deg, rgba(17, 24, 39, 0.98), rgba(15, 23, 42, 0.98));
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 24px;
      box-shadow: 0 32px 80px rgba(15, 23, 42, 0.55);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: var(--accent);
    }

    p {
      line-height: 1.6;
      margin: 0 0 12px;
    }

    .muted {
      color: var(--muted);
    }

    .rule {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(248, 113, 113, 0.12);
      color: #fecaca;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Website blocked</h1>
    <p>This site is blocked by ParentalControl.</p>
    <p class="muted" id="ruleText">Loading rule details...</p>
    <p class="rule" id="ruleBadge">Blocked by policy</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
